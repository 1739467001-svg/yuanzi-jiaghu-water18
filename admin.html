<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>运营后台 · 原子江湖（开发态）</title>
<style>
 :root{--ink:#304a3f;--muted:#8b958b;--line:#dfe3d8;--paper:#fafaf3;--card:#fffef7;--green:#3d6453;--seal-red:#b4432f;--hall-blue:#16305c;--gold:#8a6b3c;--amber-bg:#f8f2e3;--amber-line:#ecdfc0}
 *{box-sizing:border-box}body{margin:0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#eef0e6;color:var(--ink)}
 .wrap{max-width:1080px;margin:0 auto;padding:28px 22px 60px}
 header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
 .lockup{display:flex;align-items:center;gap:12px}
 .seal{display:flex;align-items:center;justify-content:center;width:38px;height:41px;font-family:serif;font-size:17px;font-weight:700;border:1.5px solid var(--seal-red);border-radius:5px;color:var(--seal-red);transform:rotate(-3deg);letter-spacing:-4px}
 .seal span{margin-top:13px;font-size:15px;margin-left:1px}
 h1{font-size:19px;margin:0;letter-spacing:1px}
 h1 small{display:block;font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.5px;font-weight:400}
 .links a{font-size:11px;color:#5b7a63;text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 12px;margin-left:8px}
 .banner{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:13px 16px;font-size:12px;line-height:1.9;color:#7a5c2e;margin-bottom:20px}
 .grid{display:grid;gap:14px}
 .edition{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px 19px}
 .edition header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 .edition h2{font-size:15px;margin:0}
 .badge{font-size:10px;border-radius:4px;padding:3px 8px;letter-spacing:.5px}
 .badge.pub{background:#e3ecdd;color:#3f6b45}.badge.draft{background:#efe8d8;color:#8a6b3c}.badge.review{background:#e6e9f2;color:#4a5f8a}.badge.withdrawn{background:#f3e3dd;color:#a05a48}
 .meta{font-size:11px;color:var(--muted);margin:8px 0 12px;line-height:1.8}
 .actions{display:flex;gap:8px;flex-wrap:wrap}
 button{font:inherit;font-size:11px;border-radius:6px;padding:7px 13px;border:1px solid var(--line);background:#f4f5ea;color:#5c6f58;cursor:pointer}
 button.primary{background:var(--green);border-color:var(--green);color:#f4f4e9}
 button.danger{background:#f4eae0;border-color:#e9d7c7;color:#b07a66}
 button:disabled{opacity:.4;cursor:wait}
 table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
 th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eceee2;vertical-align:middle}
 th{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.5px}
 td.actions-cell{white-space:nowrap}
 .audit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px 19px;margin-top:18px}
 .audit h2{font-size:14px;margin:0 0 10px}
 .audit ol{margin:0;padding-left:18px;font-size:11px;color:#617354;line-height:2}
 .audit .empty{font-size:11px;color:var(--muted)}
 .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#344f40;color:#fffaf0;padding:11px 18px;border-radius:8px;font-size:12px;z-index:50}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/admin.jsx"></script>
</body>
</html>
<style>
 .tabs{display:flex;gap:6px;margin-bottom:16px}
 .tabs button{font-size:12px;padding:9px 18px;border-radius:7px;border:1px solid var(--line);background:#f4f5ea;color:#5c6f58}
 .tabs button.active{background:var(--green);border-color:var(--green);color:#f4f4e9}
 .label-input{font:inherit;font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:260px;color:var(--ink)}
 .version-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #eceee2}
 .version-row strong{display:block;font-size:13px;color:#3f5a41}
 .version-row small{display:block;font-size:10px;color:var(--muted);margin-top:4px}
 .audit-list{margin:0;padding-left:20px;font-size:11px;color:#617354;line-height:2.1}
 .audit-list small{display:inline-block;min-width:150px;color:var(--muted)}
</style>
<style>
 .label-input-wrap{display:block;font-size:11px;color:#8b958b;margin:0 26px 14px}
 .label-input-wrap .label-input{display:block;width:100%;margin-top:7px}
</style>
<style>
 .usage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
 .usage-card{background:#f6f7ec;border:1px solid var(--line);border-radius:8px;padding:14px}
 .usage-card small{display:block;font-size:10px;color:#8b958b}
 .usage-card strong{display:block;font-family:'DM Sans',sans-serif;font-size:20px;color:#3f6b45;margin:6px 0 2px}
 .usage-card span{font-size:9px;color:#9ca48e}
</style>
